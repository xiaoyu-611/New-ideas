<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>说完你一定要答应我</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #fff0f4, #ffe6ef);
            font-family: "Microsoft Yahei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .card{
            max-width: 480px;
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(200, 35, 80, 0.12);
            text-align: center;
        }
        h2{
            color: #c82350;
            font-size: 28px;
            margin-bottom: 40px;
        }
        .next-btn{
            border: none;
            background-color: #f56c6c;
            color: #fff;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.25s;
            -webkit-tap-highlight-color: transparent;
        }
        .next-btn:hover{
            background-color: #e04848;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>说完你一定要答应我</h2>
    <button class="next-btn" id="goNextBtn">你先说什么事</button>
</div>

<script>
    const goNextBtn = document.getElementById("goNextBtn");
    // 点击跳转到第三个页面 talk2.html
    goNextBtn.onclick = function(){
        location.href = "talk2.html";
    }
</script>
</body>
</html>
